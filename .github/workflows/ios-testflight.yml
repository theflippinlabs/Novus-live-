# Builds the NOVUS LIVE iPhone/iPad app on a Mac and sends it to TestFlight (App Store Connect).
#
# One-time setup — repository Settings › Secrets and variables › Actions › New repository secret:
#   APPLE_TEAM_ID        Apple Developer Team ID (10 characters, developer.apple.com › Membership)
#   ASC_KEY_ID           App Store Connect API key ID (App Store Connect › Users and Access › Integrations › Keys, role Admin)
#   ASC_ISSUER_ID        Issuer ID shown on that same page
#   ASC_KEY_P8           Content of the downloaded AuthKey_XXXX.p8 file (the whole text)
# Optional repository variable: APP_BUNDLE_ID (default com.novuslive.app) — must match the app created in App Store Connect.
#
# Runs by hand (Actions › iOS → TestFlight › Run workflow) or when the iOS app changes.
name: iOS → TestFlight

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version shown on the App Store (e.g. 1.0)"
        required: false
        default: "1.0"
  push:
    branches: [claude/novus-live-app-7qxs89]
    paths:
      - "ios/**"
      - "capacitor.config.ts"
      - ".github/workflows/ios-testflight.yml"

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      BUNDLE_ID: ${{ vars.APP_BUNDLE_ID || 'com.novuslive.app' }}
      VERSION: ${{ github.event.inputs.version || '1.0' }}
    steps:
      - name: Apple keys present?
        id: keys
        run: |
          if [ -z "$APPLE_TEAM_ID" ] || [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ]; then
            echo "::warning::Apple secrets not set yet (APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8) — nothing to build."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.keys.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.keys.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install and build the web app
        if: steps.keys.outputs.ready == 'true'
        run: |
          npm ci
          npm run build:web
          npx cap sync ios

      - name: Xcode
        if: steps.keys.outputs.ready == 'true'
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: App Store Connect key
        if: steps.keys.outputs.ready == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          sed "s/__TEAM_ID__/${APPLE_TEAM_ID}/" ios/ci/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"

      - name: Archive (signed automatically)
        if: steps.keys.outputs.ready == 'true'
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" archive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: Upload to TestFlight
        if: steps.keys.outputs.ready == 'true'
        run: |
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "Uploaded build ${{ github.run_number }} (version $VERSION). It appears in App Store Connect › TestFlight after Apple's processing (10–30 min)."

      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
